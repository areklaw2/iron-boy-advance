[workspace]
members = ["clients/*", "crates/*"]

resolver = "3"

[workspace.dependencies]
thiserror = "2.0.20"
bitfields = "3.0.0"
getset = "0.1.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
serde = { version = "1.0.229", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.profiling]
inherits = "dev"
opt-level = 0
debug = true
